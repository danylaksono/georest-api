name: Build release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [pygeoapi, varnish]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/georest-${IMAGE_NAME}:${GITHUB_REF_NAME}"
          output=(--output type=cacheonly)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            output=(--tag "$tag" --push)
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "images/${IMAGE_NAME}/Dockerfile" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            "${output[@]}" .
