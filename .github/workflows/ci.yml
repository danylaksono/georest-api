name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.6 pytest==9.2.0 PyYAML==6.0.4
      - run: ruff check --isolated --select E4,E7,E9,F,I images/pygeoapi/georest_config scripts tests
      - run: python -m pytest -q tests/test_manifest.py
        env:
          PYTHONPATH: images/pygeoapi
      - name: Validate the Compose overlays
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.cache.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.cache.yaml -f compose.secure.yaml config --quiet
          KEYCLOAK_DB_ADMIN_PASSWORD=config-check-admin KEYCLOAK_DB_PASSWORD=config-check-app \
            docker compose --env-file .env.example -f compose.yaml -f compose.cache.yaml -f compose.secure.yaml -f compose.auth.yaml config --quiet

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [demo, external, cache-demo, cache-external, https-demo, https-external, oidc]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Run the deployment fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          case "$FIXTURE" in
            demo) python tests/deployment.py demo ;;
            external) python tests/deployment.py external ;;
            cache-demo) python tests/deployment.py demo --level 2 ;;
            cache-external) python tests/deployment.py external --level 2 ;;
            https-demo) python tests/secure_deployment.py ;;
            https-external) python tests/secure_deployment.py --external ;;
            oidc) python tests/oidc_deployment.py ;;
            *) exit 1 ;;
          esac
