services:
  configure:
    depends_on:
      postgis:
        condition: service_healthy
        required: false
    environment:
      GEOREST_OIDC: "true"
      GEOREST_PRIVATE_READ: ${GEOREST_PRIVATE_READ:-false}
      GEOREST_PRIVATE_TILES: ${GEOREST_PRIVATE_TILES:-false}
    volumes:
      - auth-config:/runtime/auth

  traefik:
    depends_on:
      authorizer:
        condition: service_healthy
        restart: true
    networks: [clients, auth-edge, identity-edge]

  authorizer:
    image: ${GEOREST_REGISTRY:-ghcr.io/danylaksono}/georest-pygeoapi:${GEOREST_VERSION:-dev}
    build:
      context: .
      dockerfile: images/pygeoapi/Dockerfile
    entrypoint: ["/venv/bin/gunicorn", "--bind=0.0.0.0:8080", "--workers=2", "--threads=4", "georest_config.authorizer:application"]
    networks: [auth-edge, policy]
    healthcheck:
      test: ["CMD", "/venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15

  opa:
    image: openpolicyagent/opa:1.22.4@sha256:ff50f50332ff9e722ffafe2658c195ced1f9b6d4f3064000c2ecfa8cdf7acccf
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error", "/policy/access.rego", "/runtime/current/acl.json"]
    depends_on:
      configure:
        condition: service_completed_successfully
        restart: true
    volumes:
      - ./auth/opa:/policy:ro
      - auth-config:/runtime:ro
    networks: [policy, identity-keys]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", 'http.send({"method":"get","url":"http://127.0.0.1:8181/health","timeout":"1s"}).status_code == 200']
      interval: 4s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: traefik
      KC_CACHE: local
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME:
      KC_BOOTSTRAP_ADMIN_PASSWORD:
    depends_on:
      identity-db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${KEYCLOAK_REALM_FILE:-./config/local/keycloak/realm.json}
        target: /opt/keycloak/data/import/georest-realm.json
        read_only: true
        bind:
          create_host_path: false
    networks: [identity-db, identity-edge, identity-keys]
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 24

  identity-db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    depends_on:
      traefik:
        condition: service_healthy
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_ADMIN_PASSWORD:?set KEYCLOAK_DB_ADMIN_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - identity-data:/var/lib/postgresql/data
      - ./auth/keycloak/10-role.sh:/docker-entrypoint-initdb.d/10-role.sh:ro
    networks: [identity-db]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "keycloak"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  auth-edge:
    internal: true
  policy:
    internal: true
  identity-edge:
    internal: true
  identity-keys:
    internal: true
  identity-db:
    internal: true

volumes:
  auth-config: {}
  identity-data: {}
